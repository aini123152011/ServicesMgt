# 本地构建 override：只补 build 段，镜像名与 compose.yaml 一致（IMAGE_PREFIX 留空时用本地镜像）。
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# 注意：平台镜像的 Dockerfile.platform 需要先有前端产物（pnpm build → platform/frontend/dist），
# 否则构建会失败。服务镜像若需换 apt 源加速，用 scripts/build.sh（支持 BUILD_ARGS 透传）构建后
# 再用 compose.yaml 起容器。
services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
  chrony:
    build: ./services/chrony
  nginx:
    build: ./services/nginx
  rsyslog:
    build: ./services/rsyslog
  webdav:
    build: ./services/webdav
  sftp:
    build: ./services/sftp
  vsftpd:
    build: ./services/vsftpd
  tftpd-hpa:
    build: ./services/tftpd-hpa
  samba:
    build: ./services/samba
  nfs-ganesha:
    build: ./services/nfs-ganesha
  snmptrapd:
    build: ./services/snmptrapd
  postfix:
    build: ./services/postfix
