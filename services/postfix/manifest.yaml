# 服务元数据：平台 Service Registry 扫描 services/* 时按此识别与展示
# 字段名是平台契约，后续服务照此复制，勿改名
name: postfix
display_name: SMTP 邮件中继
display_name_en: "SMTP Mail Relay"
category: log-monitor          # 分类枚举: time | file-share | log-monitor
description: 基于 postfix 的 SMTP 服务，为 BMC 告警邮件提供中继与投递
container_name: fx-postfix
config_dir: /etc/postfix       # 配置卷在容器内的挂载点
config_files:                  # 渲染产物相对 config_dir 的路径列表
  - main.cf
ports:
  - port: 25
    protocol: tcp
    description: SMTP 服务端口
reload_mode: restart           # inet_interfaces 等参数与 master.cf 结构变更官方要求重启生效
data_dir: /var/spool/postfix   # 数据卷在容器内的挂载点（本批新增的可选契约字段）
usage:                        # 详情页「外部使用方式」卡片内容；command 里的 {{host}}/{{port}} 由前端按当前页面替换
  - target: BMC
    summary: 在 BMC 上把告警邮件的中继服务器指向本服务（Redfish Managers/{id}/SmtpService，或 BMC Web 的邮件告警设置）
    command: |
      # BMC Web → 设置 → 告警/邮件通知：
      SMTP 服务器 {{host}}    端口 {{port}}    发件地址 bmc@fx-mail.local    认证 无
  - target: Linux
    summary: 用 SMTP 客户端验证本服务可中继（来源须在本服务可信网段 mynetworks 内，否则 RCPT 被拒）
    command: curl -sv smtp://{{host}}:{{port}} --mail-from bmc@test.local --mail-rcpt test@example.com
