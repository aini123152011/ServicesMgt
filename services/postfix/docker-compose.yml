# 单服务独立部署入口：cd services/postfix && docker compose up -d
# 独立网络 + 独立卷，与其他服务互不影响（R1 隔离）；平台总编排按需引用本文件
services:
  postfix:
    # 有 image 时 compose 会把 build 产物打上该 tag，也方便直接使用 CI 构建好的镜像
    image: ${IMAGE_PREFIX:-}bmc-postfix:${IMAGE_TAG:-latest}
    build: .
    container_name: bmc-postfix
    restart: unless-stopped
    ports:
      # 默认发布到宿主机所有地址，供内网 BMC 设备投递告警邮件；
      # 仅本机使用时改为 "127.0.0.1:25:25"
      - "25:25"
    volumes:
      # 配置卷：平台把渲染后的 main.cf 写入这里，reload.sh 触发生效；
      # master.cf / dynamicmaps.cf 由 entrypoint 播种，平台不渲染
      - postfix-config:/etc/postfix
      # 数据卷：postfix 队列目录（收发中的邮件与 chroot 运行时文件），重建容器不丢队列
      - postfix-data:/var/spool/postfix
    networks:
      - postfix-net
    healthcheck:
      # 与 Dockerfile 的 HEALTHCHECK 保持一致
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  postfix-net:
    # 每服务独立 bridge 网络，服务间互不可见
    driver: bridge

volumes:
  postfix-config:
  postfix-data:
