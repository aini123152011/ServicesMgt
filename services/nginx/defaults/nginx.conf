worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 2048m;

    server {
        listen 80;
        server_name _;

        root /data/nginx;


        location / {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            dav_methods PUT DELETE MKCOL COPY MOVE;
            create_full_put_path on;
            dav_access all:rw;

            # NOTE: 此处不能加 try_files：它在 precontent 阶段运行，对不存在的文件直接
            # 返回 404，会让 DAV 的 PUT 无法新建文件（上传固件正是这条路径）。
            # 静态文件缺失由 root 处理器自然返回 404，不需要 try_files 兜底。
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        root /data/nginx;

        ssl_certificate /etc/nginx-bmc/ssl/cert.pem;
        ssl_certificate_key /etc/nginx-bmc/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;


        location / {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            dav_methods PUT DELETE MKCOL COPY MOVE;
            create_full_put_path on;
            dav_access all:rw;

            # NOTE: 同 HTTP 段，try_files 会挡住 DAV 的 PUT 新建文件，这里同样不能加
        }
    }
}
