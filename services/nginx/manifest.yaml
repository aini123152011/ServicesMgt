# 服务元数据：平台 Service Registry 扫描 services/* 时按此识别与展示
# 字段名是平台契约，各服务保持规范一致
name: nginx
display_name: HTTP / HTTPS 文件服务
category: file-share          # 分类枚举: time | file-share | log-monitor
description: 提供高性能固件分发与日志收集的 HTTP/HTTPS 服务，支持 Basic 认证、限速与故障注入
container_name: bmc-nginx
config_dir: /etc/nginx-bmc    # 配置卷在容器内的挂载点
config_files:                 # 渲染产物相对 config_dir 的路径列表
  - nginx.conf
  - htpasswd
ports:
  - port: 80
    protocol: tcp
    description: HTTP 文件下载与上传端口
  - port: 443
    protocol: tcp
    description: HTTPS 安全端口
reload_mode: hot              # nginx 原生支持热重载，发 SIGHUP / nginx -s reload 零停机生效
data_dir: /data/nginx         # 数据卷在容器内的挂载点：存储分发固件与上传文件
usage:                        # 详情页「外部使用方式」卡片内容；command 里的 {{host}}/{{port}} 由前端按当前页面替换
  - target: BMC
    summary: 让 BMC 从本服务下载固件/配置文件（固件更新、日志导出处填该 URL；本示例不触发实际刷写）
    command: |
      # BMC Web → 固件更新 / 配置导入，URL 填：
      http://{{host}}:{{port}}/firmware.bin
  - target: 任意客户端
    summary: 用 curl 验证文件下载与目录列表（开启 Basic 认证时加 -u 用户:密码）
    command: curl -I http://{{host}}:{{port}}/firmware.bin
  - target: 任意客户端
    summary: 用 HTTP PUT 上传固件到本服务（需 enable_upload 开启，数据卷挂载点 /data/nginx）
    command: curl -T ./firmware.bin http://{{host}}:{{port}}/firmware.bin
