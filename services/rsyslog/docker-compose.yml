# 单服务独立部署入口：cd services/rsyslog && docker compose up -d
# 独立网络 + 独立卷，与其他服务互不影响（R1 隔离）；平台总编排按需引用本文件
services:
  rsyslog:
    # 有 image 时 compose 会把 build 产物打上该 tag，也方便直接使用 CI 构建好的镜像
    image: ${IMAGE_PREFIX:-}fx-rsyslog:${IMAGE_TAG:-latest}
    build: .
    container_name: fx-rsyslog
    restart: unless-stopped
    ports:
      # 默认发布到宿主机所有地址，供内网 BMC 设备发送日志；
      # 仅本机使用时改为 "127.0.0.1:514:514/udp" 等
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      # 配置卷：平台把渲染后的 rsyslog.conf 写入这里，reload.sh 触发生效
      - rsyslog-config:/etc/rsyslog
      # 数据卷：日志归档地（log_root），按 日期目录/来源IP 存放归档文件，
      # 重建容器不丢失已归档日志
      - rsyslog-data:/var/log/bmc
    networks:
      - rsyslog-net
    healthcheck:
      # 与 Dockerfile 的 HEALTHCHECK 保持一致
      test: ["CMD-SHELL", "grep -qs rsyslogd /proc/[0-9]*/comm"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  rsyslog-net:
    # 每服务独立 bridge 网络，服务间互不可见
    driver: bridge

volumes:
  rsyslog-config:
  rsyslog-data:
