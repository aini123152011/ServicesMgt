# 服务元数据：平台 Service Registry 扫描 services/* 时按此识别与展示
# 字段名是平台契约，后续服务照此复制，勿改名
name: vsftpd
display_name: FTP 文件服务器
display_name_en: "FTP File Server"
category: file-share          # 分类枚举: time | file-share | log-monitor
description: 基于 vsftpd 的 FTP 服务，本地账号密码登录，支持被动模式、chroot 与限速
container_name: fx-vsftpd
config_dir: /etc/vsftpd       # 配置卷在容器内的挂载点
config_files:                 # 渲染产物相对 config_dir 的路径列表
  - vsftpd.conf
  - local_users.txt
ports:
  - port: 21
    protocol: tcp
    description: FTP 控制端口
  - port: 40000
    protocol: tcp
    description: 被动模式数据端口（schema 默认范围下界）
  - port: 40100
    protocol: tcp
    description: 被动模式数据端口（schema 默认范围上界）
reload_mode: restart          # vsftpd 不支持 SIGHUP 重读配置，重启进程生效
data_dir: /data               # 数据卷在容器内的挂载点：各本地用户家目录的父目录
usage:                        # 详情页「外部使用方式」卡片内容；command 里的 {{host}}/{{port}} 由前端按当前页面替换
  - target: Linux
    summary: 用 FTP 客户端登录并列出家目录（账号取本服务 local_users 清单，默认 bmcuser；BMC 侧无 FTP 能力）
    command: curl -u bmcuser:ChangeMe123 ftp://{{host}}:{{port}}/ --list-only
  - target: Linux
    summary: 上传固件验证写权限（write_enabled 关闭或 write_deny_550 模式下返回 550）
    command: curl -u bmcuser:ChangeMe123 -T ./firmware.bin ftp://{{host}}:{{port}}/firmware.bin
  - target: 任意客户端
    summary: 经网关/NAT 访问时必须放行被动模式数据端口段 40000-40100，否则登录成功但传输挂起
    command: |
      # 放行被动模式数据端口段（firewalld 示例）：
      firewall-cmd --add-port=40000-40100/tcp
