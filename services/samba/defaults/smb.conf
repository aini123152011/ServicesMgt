[global]
   workgroup = WORKGROUP
   server string = BMC Samba Server
   security = user
   map to guest = Bad User
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000

   server min protocol = SMB2_02

[bmc_share]
   path = /data/samba
   read only = no
   writable = yes

   guest ok = no

   valid users = smbuser 
   browseable = yes
   create mask = 0775
   directory mask = 0775
