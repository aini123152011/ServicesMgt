# 单服务独立部署入口：cd services/chrony && docker compose up -d
# 独立网络 + 独立卷，与其他服务互不影响（R1 隔离）；平台总编排按需引用本文件
services:
  chrony:
    # 有 image 时 compose 会把 build 产物打上该 tag，也方便直接使用 CI 构建好的镜像
    image: ${IMAGE_PREFIX:-}bmc-chrony:${IMAGE_TAG:-latest}
    build: .
    container_name: bmc-chrony
    restart: unless-stopped
    ports:
      # 默认发布到宿主机所有地址，供内网设备同步时间；
      # 仅本机使用时改为 "127.0.0.1:123:123/udp"
      - "123:123/udp"
    volumes:
      # 配置卷：平台把渲染后的 chrony.conf 写入这里，reload.sh 触发生效
      - chrony-config:/etc/chrony
      # 数据卷：driftfile 等运行时状态，重建容器不丢失校准结果
      - chrony-data:/var/lib/chrony
    networks:
      - chrony-net
    healthcheck:
      # 与 Dockerfile 的 HEALTHCHECK 保持一致
      test: ["CMD", "chronyc", "tracking"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  chrony-net:
    # 每服务独立 bridge 网络，服务间互不可见
    driver: bridge

volumes:
  chrony-config:
  chrony-data:
