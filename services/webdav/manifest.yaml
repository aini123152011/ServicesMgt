# 服务元数据：平台 Service Registry 扫描 services/* 时按此识别与展示
# 字段名是平台契约，后续服务照此复制，勿改名
name: webdav
display_name: WebDAV 文件服务器
display_name_en: "WebDAV File Server"
category: file-share          # 分类枚举: time | file-share | log-monitor
description: 基于 Apache mod_dav 的 WebDAV 服务，支持 Basic 认证、只读模式与上传限额
container_name: fx-webdav
config_dir: /etc/apache2-bmc  # 配置卷在容器内的挂载点（自定义目录，避开包自带配置）
config_files:                 # 渲染产物相对 config_dir 的路径列表
  - apache2.conf
  - users.txt
ports:
  - port: 8080
    protocol: tcp
    description: WebDAV 服务端口
reload_mode: restart          # 端口/根目录等指令无法经 SIGUSR1 热生效，重启进程保证配置整体一致
data_dir: /var/lib/dav        # 数据卷在容器内的挂载点：DAV 根目录（root_dir）与文件锁数据库
usage:                        # 详情页「外部使用方式」卡片内容；command 里的 {{host}}/{{port}} 由前端按当前页面替换
  - target: 浏览器 / WebDAV 客户端
    summary: 用 WebDAV 客户端连本服务（Windows 映射网络驱动器 / macOS Finder「连接服务器」；账号取本服务 users 清单，默认 bmc。浏览器直接打开根路径会 404——服务不提供目录索引页，属预期）
    command: http://{{host}}:{{port}}/
  - target: Linux
    summary: 用 curl 上传固件（read_only 开启或 method_not_allowed_405 模式下返回 405；本地路径与远端文件名自定）
    command: curl -u bmc:ChangeMe123 -T ./bmc-fw-test.iso http://{{host}}:{{port}}/bmc-fw-test.iso
  - target: Linux
    summary: 用 curl 列目录并下载文件（PROPFIND 就是 WebDAV 的目录列表，浏览器打不开的根路径这里能看到；-O 按 URL 末段命名保存）
    command: |
      curl -u bmc:ChangeMe123 -X PROPFIND -H "Depth: 1" http://{{host}}:{{port}}/
      curl -u bmc:ChangeMe123 -O http://{{host}}:{{port}}/bmc-fw-test.iso
