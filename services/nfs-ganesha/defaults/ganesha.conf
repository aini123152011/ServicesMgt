NFS_CORE_PARAM {
    NFS_Port = 2049;
    Protocols = 3, 4;
}

NFSV4 {
    Graceless = true;
}

EXPORT {
    Export_Id = 1;
    Path = "/data/nfs";
    Pseudo = "/data/nfs";

    Access_Type = RW;

    Squash = no_root_squash;

    CLIENT {
        # NOTE: Clients 的值不能加引号——ganesha 4.3 的解析器会对 CLIENT 块做客户端
        # 列表校验，遇到双引号字符串报 "Expected a client, got a double quoted
        # string"，进而让整个 EXPORT 校验失败（导出不加载，客户端挂载报 ENOENT）。
        Clients = *;
    }

    FSAL {
        Name = VFS;
    }
}
