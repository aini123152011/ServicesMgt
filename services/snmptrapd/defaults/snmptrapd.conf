# ==== 授权社区 ====
# 每个社区一行，授权 log/execute/net 三类动作
# （依据 snmptrapd.conf(5) authCommunity：log=记录日志 execute=允许 traphandle 执行 net=允许转发）
authCommunity log,execute,net public
authCommunity log,execute,net bmctrap

# ==== 运行时参数 ====
# WARNING: 监听地址/日志落盘参数/output 选项是 snmptrapd 的命令行参数，配置文件中没有对应指令；
# entrypoint 每次重启进程时从下方注释行重读这些值重新拼装启动命令，
# 渲染产物是唯一事实来源，勿删这些注释行
#
# 记录格式（-F）不在这里渲染：它是分流器 splitter.py 的解析契约（行首必须是 %b 传输地址），
# 两者必须成对演进，因此写死在 entrypoint.sh 里。output_opts 照旧控制变量绑定的渲染方式。
#
# 日志落盘布局（详见 .trellis/spec/services/index.md「日志落盘约定」）：
#   <log_root>/<日期段>/<来源标识>.log，来源标识默认按来源 IP
# 落盘由 entrypoint 起的 splitter.py 完成（stdout 分流）；它不写
# <source>/traps.log 单文件——output_file 字段已废弃，不再参与渲染。
# runtime: log_target=/dev/stdout
# runtime: log_root=/var/log/snmp
# runtime: date_dir=daily
# runtime: filename_by_ip=true
# runtime: listen=0.0.0.0:162
# 输出格式映射（依据 net-snmp snmpcmd(1) 输出选项文档）——控制变量绑定的渲染方式，
# 记录整体布局由 entrypoint 的 -F 决定（行首固定是来源传输地址）：
#   default -> 无附加选项（net-snmp 内建渲染：符号名 + 类型 + 值）
#   brief   -> -Ov（只输出变量值，不带变量名/OID）
#   full    -> -Of（OID 输出完整路径不缩写，信息最全）
# runtime: output_opts=-Of
