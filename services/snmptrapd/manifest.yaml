# 服务元数据：平台 Service Registry 扫描 services/* 时按此识别与展示
# 字段名是平台契约，后续服务照此复制，勿改名
name: snmptrapd
display_name: SNMP Trap 接收
category: log-monitor          # 分类枚举: time | file-share | log-monitor
description: 基于 net-snmp snmptrapd 的 Trap 接收服务，接收 BMC 告警事件并落盘
container_name: fx-snmptrapd
config_dir: /etc/snmp          # 配置卷在容器内的挂载点
config_files:                  # 渲染产物相对 config_dir 的路径列表
  - snmptrapd.conf
ports:
  - port: 162
    protocol: udp
    description: SNMP Trap 接收端口
reload_mode: restart           # SIGHUP 只能重读 conf 内指令，监听/输出等命令行参数需重启进程生效
data_dir: /var/log/snmp        # 数据卷在容器内的挂载点（本批新增的可选契约字段）
usage:                        # 详情页「外部使用方式」卡片内容；command 里的 {{host}}/{{port}} 由前端按当前页面替换
  - target: BMC
    summary: 在 BMC 上把 SNMP Trap 目的地址指向本服务（BMC Web 的 SNMP/告警上报设置；Redfish 未见独立 Trap 目的资源）
    command: |
      # BMC Web → 设置 → SNMP / 告警上报：
      Trap 目的地址 {{host}}    端口 {{port}}    版本 v2c    社区 bmctrap
  - target: Linux
    summary: 用 net-snmp 客户端发一条 v2c Trap（社区须在本服务 communities 清单内，默认 bmctrap）
    command: snmptrap -v2c -c bmctrap {{host}}:{{port}} '' 1.3.6.1.4.1.8072.2.3.0.1 1.3.6.1.4.1.8072.2.3.0.2 s "fx-trap-test"
  - target: Linux
    summary: 在目标机上查看 Trap 落盘结果（容器内日志文件 /var/log/snmp/traps.log）
    command: docker exec fx-snmptrapd tail -n 5 /var/log/snmp/traps.log
