# 服务元数据：平台 Service Registry 扫描 services/* 时按此识别与展示
# 字段名是平台契约，后续服务照此复制，勿改名
name: tftpd-hpa
display_name: TFTP 文件服务器
category: file-share          # 分类枚举: time | file-share | log-monitor
description: 基于 tftpd-hpa 的 TFTP 服务，供 BMC/网络设备上传下载配置与固件
container_name: fx-tftpd-hpa
config_dir: /etc/tftpd-hpa    # 配置卷在容器内的挂载点
config_files:                 # 渲染产物相对 config_dir 的路径列表
  - tftpd-hpa.conf
ports:
  - port: 69
    protocol: udp
    description: TFTP 服务端口
reload_mode: restart          # in.tftpd 无配置热加载能力，参数仅在启动时解析，重启进程生效
data_dir: /srv/tftp           # 数据卷在容器内的挂载点：TFTP 服务根目录（root_dir）
usage:                        # 详情页「外部使用方式」卡片内容；command 里的 {{host}}/{{port}} 由前端按当前页面替换
  - target: BMC
    summary: 让 BMC 从本服务 TFTP 取固件/配置文件（固件更新、配置导入处填 TFTP 地址；本示例不触发实际刷写）
    command: |
      # BMC Web → 固件更新 / 配置导入（TFTP）：
      服务器 {{host}}    端口 {{port}}    文件名 firmware.bin
  - target: Linux
    summary: 用 tftp-hpa 客户端上传再取回，验证读写（服务根目录即数据卷挂载点 /srv/tftp）
    command: |
      tftp {{host}} -c put ./firmware.bin firmware.bin
      tftp {{host}} -c get firmware.bin firmware-downloaded.bin
