# 单服务独立部署入口：cd services/tftpd-hpa && docker compose up -d
# 独立网络 + 独立卷，与其他服务互不影响（R1 隔离）；平台总编排按需引用本文件
services:
  tftpd-hpa:
    # 有 image 时 compose 会把 build 产物打上该 tag，也方便直接使用 CI 构建好的镜像
    image: ${IMAGE_PREFIX:-}fx-tftpd-hpa:${IMAGE_TAG:-latest}
    build: .
    container_name: fx-tftpd-hpa
    restart: unless-stopped
    ports:
      # 默认发布到宿主机所有地址，供 BMC/网络设备上传下载；仅本机使用时改为 "127.0.0.1:69:69/udp"
      - "69:69/udp"
    volumes:
      # 配置卷：平台把渲染后的 tftpd-hpa.conf 写入这里，reload.sh 触发生效
      - tftpd-hpa-config:/etc/tftpd-hpa
      # 数据卷：TFTP 服务根目录（schema root_dir，默认 /srv/tftp），
      # 传输的配置/固件文件持久化，重建容器不丢失
      - tftpd-hpa-data:/srv/tftp
    networks:
      - tftpd-hpa-net
    healthcheck:
      # 与 Dockerfile 的 HEALTHCHECK 保持一致
      test: ["CMD-SHELL", "grep -qs in.tftpd /proc/[0-9]*/comm"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  tftpd-hpa-net:
    # 每服务独立 bridge 网络，服务间互不可见
    driver: bridge

volumes:
  tftpd-hpa-config:
  tftpd-hpa-data:
