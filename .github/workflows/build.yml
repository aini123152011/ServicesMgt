# 服务镜像多架构(arm64+amd64)构建 —— 仅做环境准备 + 调用统一脚本 scripts/build.sh，构建逻辑不在此重复
name: build-images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PLATFORMS: linux/arm64,linux/amd64

jobs:
  build:
    name: build service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU 模拟器 + buildx 构建器（amd64 机器上交叉构建 arm64）
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 仅默认分支需要登录 GHCR 推送
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR / 非默认分支：多架构构建校验，不产出镜像
      - name: Build (validate only)
        if: github.ref != 'refs/heads/main'
        run: scripts/build.sh --check

      # 默认分支：多架构构建并推送 ghcr.io/<owner>/<service>:latest
      - name: Build & push
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          PUSH: '1'
        run: scripts/build.sh
