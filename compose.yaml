# 一键编排：一次性拉起平台（含 PostgreSQL）与 13 个 BMC 测试服务。
#
#   docker compose up -d                       # 全部
#   docker compose up -d chrony nginx          # 只起某几个
#   docker compose ps                          # 看健康状态
#
# 端口方案：**每个服务都在统一范围 18101–18115 内分配一个宿主端口**（便于文档化与防火墙放行），
# 同时**保留 BMC 侧必须的标准端口**——NTP 123、TFTP 69、SNMP Trap 162、Syslog 514、SMTP 25、
# SMB 445、NFS 2049、FTP 21 这些，被测 BMC 通常只能填 IP（改不了端口），去掉就失去
# 「BMC 测试仪器」的意义。所以 chrony/tftpd/rsyslog/snmptrapd/postfix/samba/nfs/vsftpd 是
# 「标准端口 + 范围内端口」双发布，nginx/sftp/webdav 没有标准端口需求，只发布范围内端口。
#
# DHCP 是唯一「不发布任何标准端口」的服务，两个原因：
#   1. **DHCP 不能靠端口映射工作**：客户端从 0.0.0.0 广播到 255.255.255.255，Docker 的 NAT 端口
#      发布只处理单播，且 BMC 必须与 DHCP 服务在同一二层广播域，所以 67/547 发布了也不通；
#   2. **53 在本机被占**：宿主机 libvirt 的 dnsmasq 已监听 192.168.122.1:53，Docker 再绑
#      0.0.0.0:53 会 EADDRINUSE（实测），发布 53 会让 docker compose up 直接失败。
# 因此 dhcp 只发布统一范围内的 18113（DNS）。要给现场 BMC 下发地址/DNS，见下面 macvlan 说明。
#
# 与「单服务独立部署」的区别（services/<name>/docker-compose.yml）：
#   - 独立部署用**服务自身的规范端口**（nginx 80/443、sftp 22），适合在别的机器上单独跑；
#   - 本编排用**平台部署态的宿主端口**（nginx 18088/18443、sftp 2222），与平台实机部署一致，
#     避免与宿主机自带服务抢端口（这也是实机验收套件 `scripts/verify_bmc_platform_e2e.py`
#     使用的端口，见文件头的 PORT_* 常量）。
#   - 卷一律用 `./volumes/<服务>-{config,data}` 绑定挂载，与平台部署目录的布局一致，
#     这样平台渲染的配置、服务产生的日志/数据在两种部署方式间可以直接复用。
#
# 密钥不写进本文件：从同目录 .env 读取（`VOLUMES_MOUNT_ROOT` 等见 .env.example）。
# nfs-ganesha 必须 privileged（VFS FSAL 在 ext4 绑定挂载上需要完整能力与未受限的 seccomp/SELinux，
# 见 .trellis/spec/services/container-runtime-guidelines.md 第 5 条）。
# dhcp 需要 NET_ADMIN/NET_RAW：dnsmasq 的 DHCP 要开原始套接字、读写接口状态。

# 项目名会加在网络/卷名前（如 servicesmgt_chrony-net）；取短名，避免 bmc-servicesmgt_xxx 这种冗长前缀
name: servicesmgt

services:
  # ---------------------------------------------------------------- 平台
  platform-pg:
    image: postgres:18.4-alpine
    container_name: bmc-platform-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中提供}
      POSTGRES_DB: ${POSTGRES_DB:-bmc_platform}
    volumes:
      - bmc-platform-isolated-pg-data:/var/lib/postgresql
    networks: [bmc-platform-isolated-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bmc} -d ${POSTGRES_DB:-bmc_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  platform:
    image: ${IMAGE_PREFIX:-}bmc-platform:${IMAGE_TAG:-latest}
    container_name: bmc-platform-backend
    restart: unless-stopped
    depends_on:
      platform-pg:
        condition: service_healthy
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-BMC Services Platform}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须在 .env 中提供}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bmc}:${POSTGRES_PASSWORD}@bmc-platform-pg:5432/${POSTGRES_DB:-bmc_platform}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?FIRST_SUPERUSER 必须在 .env 中提供}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD 必须在 .env 中提供}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:18080}
      # 平台容器内看到的服务目录与数据卷根；与下面的挂载点对应
      SERVICES_DIR: /app/services
      VOLUMES_MOUNT_ROOT: /var/lib/platform
      UPDATE_REGISTRY: ${UPDATE_REGISTRY:-}
      PLATFORM_CONTAINER_NAME: bmc-platform-backend
    ports:
      - "18080:8000"
    volumes:
      # 服务目录只读挂进平台：registry 读 manifest/schema，渲染模板时也读这里
      - ./services:/app/services:ro
      # 数据卷根：各服务的 config/data 目录都在其下（与「单服务独立部署」共用同一布局）
      - ./volumes:/var/lib/platform
      # 平台要用 Docker API 管理 13 个服务容器（起停、日志、镜像更新、重建）
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [bmc-platform-isolated-net]

  # ---------------------------------------------------------------- 13 个服务
  chrony:
    image: ${IMAGE_PREFIX:-}bmc-chrony:${IMAGE_TAG:-latest}
    container_name: bmc-chrony
    restart: unless-stopped
    ports: ["123:123/udp", "18101:123/udp"]
    volumes:
      - ./volumes/chrony-config:/etc/chrony
      - ./volumes/chrony-data:/var/lib/chrony
    networks: [chrony-net]

  nginx:
    image: ${IMAGE_PREFIX:-}bmc-nginx:${IMAGE_TAG:-latest}
    container_name: bmc-nginx
    restart: unless-stopped
    ports: ["18102:80", "18103:443"]
    volumes:
      - ./volumes/nginx-config:/etc/nginx-bmc
      - ./volumes/nginx-data:/data/nginx
    networks: [nginx-net]

  rsyslog:
    image: ${IMAGE_PREFIX:-}bmc-rsyslog:${IMAGE_TAG:-latest}
    container_name: bmc-rsyslog
    restart: unless-stopped
    ports: ["514:514/tcp", "514:514/udp", "18104:514/tcp", "18104:514/udp"]
    volumes:
      - ./volumes/rsyslog-config:/etc/rsyslog
      - ./volumes/rsyslog-data:/var/log/bmc
    networks: [rsyslog-net]

  webdav:
    image: ${IMAGE_PREFIX:-}bmc-webdav:${IMAGE_TAG:-latest}
    container_name: bmc-webdav
    restart: unless-stopped
    ports: ["18105:8080"]
    volumes:
      - ./volumes/webdav-config:/etc/apache2-bmc
      - ./volumes/webdav-data:/var/lib/dav
    networks: [webdav-net]

  sftp:
    image: ${IMAGE_PREFIX:-}bmc-sftp:${IMAGE_TAG:-latest}
    container_name: bmc-sftp
    restart: unless-stopped
    ports: ["18106:22"]
    volumes:
      - ./volumes/sftp-config:/etc/ssh
      - ./volumes/sftp-data:/data
    networks: [sftp-net]

  vsftpd:
    image: ${IMAGE_PREFIX:-}bmc-vsftpd:${IMAGE_TAG:-latest}
    container_name: bmc-vsftpd
    restart: unless-stopped
    # 被动模式数据端口段必须整段发布，否则登录成功但列目录/传输会挂住
    ports:
      - "21:21"
      - "18107:21"
      - "40000-40100:40000-40100"
    volumes:
      - ./volumes/vsftpd-config:/etc/vsftpd
      - ./volumes/vsftpd-data:/data
    networks: [vsftpd-net]

  tftpd-hpa:
    image: ${IMAGE_PREFIX:-}bmc-tftpd-hpa:${IMAGE_TAG:-latest}
    container_name: bmc-tftpd-hpa
    restart: unless-stopped
    # 69 是被测 BMC 取固件/配置文件的 TFTP 标准端口，必须保留；18108 是统一范围内的入口
    ports: ["69:69/udp", "18108:69/udp"]
    volumes:
      - ./volumes/tftpd-hpa-config:/etc/tftpd-hpa
      - ./volumes/tftpd-hpa-data:/srv/tftp
    networks: [tftpd-net]

  samba:
    image: ${IMAGE_PREFIX:-}bmc-samba:${IMAGE_TAG:-latest}
    container_name: bmc-samba
    restart: unless-stopped
    ports: ["445:445", "18109:445"]
    volumes:
      - ./volumes/samba-config:/etc/samba-bmc
      - ./volumes/samba-data:/data/samba
    networks: [samba-net]

  nfs-ganesha:
    image: ${IMAGE_PREFIX:-}bmc-nfs-ganesha:${IMAGE_TAG:-latest}
    container_name: bmc-nfs
    restart: unless-stopped
    # VFS FSAL 在 ext4 绑定挂载上需要完整能力（见文件头说明）
    privileged: true
    ports: ["2049:2049", "18110:2049"]
    volumes:
      - ./volumes/nfs-ganesha-config:/etc/ganesha-bmc
      - ./volumes/nfs-ganesha-data:/data/nfs
    networks: [nfs-net]

  snmptrapd:
    image: ${IMAGE_PREFIX:-}bmc-snmptrapd:${IMAGE_TAG:-latest}
    container_name: bmc-snmptrapd
    restart: unless-stopped
    ports: ["162:162/udp", "18111:162/udp"]
    volumes:
      - ./volumes/snmptrapd-config:/etc/snmp
      - ./volumes/snmptrapd-data:/var/log/snmp
    networks: [snmptrapd-net]

  postfix:
    image: ${IMAGE_PREFIX:-}bmc-postfix:${IMAGE_TAG:-latest}
    container_name: bmc-postfix
    restart: unless-stopped
    ports: ["25:25", "18112:25"]
    volumes:
      - ./volumes/postfix-config:/etc/postfix
      - ./volumes/postfix-data:/var/spool/postfix
    networks: [postfix-net]

  dhcp:
    image: ${IMAGE_PREFIX:-}bmc-dhcp:${IMAGE_TAG:-latest}
    container_name: bmc-dhcp
    restart: unless-stopped
    # DHCP 要开原始套接字（NET_RAW）并读写接口状态（NET_ADMIN）
    cap_add: [NET_ADMIN, NET_RAW]
    # 只发布 DNS 的统一范围端口：67/547 走 NAT 不通，53 在宿主机被 libvirt dnsmasq 占用
    # （原因见文件头）。需要给 BMC 用标准 53 时，把本行换成 "192.168.x.y:53:53/udp" 显式绑网卡地址。
    ports: ["18113:53/udp", "18113:53/tcp"]
    volumes:
      - ./volumes/dhcp-config:/etc/dnsmasq
      - ./volumes/dhcp-data:/var/lib/dnsmasq
    networks: [dhcp-net]

  freeradius:
    image: ${IMAGE_PREFIX:-}bmc-freeradius:${IMAGE_TAG:-latest}
    container_name: bmc-freeradius
    restart: unless-stopped
    # RADIUS 认证端口是 BMC 侧只能填 IP 的标准端口，必须保留 1812/1813；18114 是统一范围内的入口
    ports: ["1812:1812/udp", "1813:1813/udp", "18114:1812/udp"]
    volumes:
      # 只挂 bmc/ 子目录：包自带的配置树留在镜像里（构建期用 $INCLUDE 接进来）
      - ./volumes/freeradius-config:/etc/freeradius/3.0/bmc
      - ./volumes/freeradius-data:/var/log/freeradius
    networks: [freeradius-net]


# 说明：13 个服务的健康检查由各服务镜像自带的 HEALTHCHECK 提供（看守护进程是否在跑），
# 这里不重复定义，避免两处维护；平台镜像也自带 HEALTHCHECK（探 /api/v1/utils/health-check/）。

# 每个服务一张独立网络（隔离性可验证：跨服务网络互不可见）；
# 平台与数据库共用一张网络，平台通过 docker.sock 管理服务容器，不需要加入各服务网络。
networks:
  # 每张网络显式指定 /24 网段：宿主机上已有 30 张网络，Docker 的默认地址池（/16 粒度）已被占满，
  # 不指定会报 "all predefined address pools have been fully subnetted"。172.30.0.0/16 在本机未被占用。
  # 每张网络同时启用 IPv6（fd00:30:<n>::/64，ULA）：宿主机无全局 IPv6，容器网络内用 ULA 验证
  # IPv6 客户端行为；enable_ipv6 是网络级开关，不需要改 Docker daemon。
  # dhcp-net 的网段同时是 dnsmasq 默认配置里的地址池所在网段（172.30.12.0/24 / fd00:30:12::/64），
  # 这样「客户端容器在同一网络里取址」才是真的能取到。
  bmc-platform-isolated-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.0.0/24 }, { subnet: fd00:30:0::/64 }] } }
  chrony-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.1.0/24 }, { subnet: fd00:30:1::/64 }] } }
  nginx-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.2.0/24 }, { subnet: fd00:30:2::/64 }] } }
  rsyslog-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.3.0/24 }, { subnet: fd00:30:3::/64 }] } }
  webdav-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.4.0/24 }, { subnet: fd00:30:4::/64 }] } }
  sftp-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.5.0/24 }, { subnet: fd00:30:5::/64 }] } }
  vsftpd-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.6.0/24 }, { subnet: fd00:30:6::/64 }] } }
  tftpd-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.7.0/24 }, { subnet: fd00:30:7::/64 }] } }
  samba-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.8.0/24 }, { subnet: fd00:30:8::/64 }] } }
  nfs-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.9.0/24 }, { subnet: fd00:30:9::/64 }] } }
  snmptrapd-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.10.0/24 }, { subnet: fd00:30:10::/64 }] } }
  postfix-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.11.0/24 }, { subnet: fd00:30:11::/64 }] } }
  dhcp-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.12.0/24 }, { subnet: fd00:30:12::/64 }] } }
  freeradius-net: { driver: bridge, enable_ipv6: true, ipam: { config: [{ subnet: 172.30.13.0/24 }, { subnet: fd00:30:13::/64 }] } }

volumes:
  # 数据库用命名卷（平台自带）；服务用绑定挂载，与「单服务独立部署」的卷布局一致。
  # **external**：这个卷是平台既有部署创建的，名字不带项目前缀；若交给 compose 管理，
  # 它会按项目名新建一个空卷（servicesmgt_bmc-platform-isolated-pg-data）→ 平台连到没有表的库，
  # 登录直接 500（实测踩到）。声明 external 即复用既有数据卷。
  bmc-platform-isolated-pg-data:
    external: true
